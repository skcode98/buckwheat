# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# 8 GB box: one 3 GB daemon beats eighteen 2 GB daemons fighting for RAM (that
# pile-up starved the Kotlin daemon until compilation fell back to no-daemon mode
# and then crashed). Keep these args stable: every unique jvmargs line spawns a new
# daemon family that never gets reused.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Turn on parallel compilation, caching and configuration caching. Configure-on-demand
# is off on purpose: deprecated, and it fights the configuration cache.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin: compile in the daemon (no separate Kotlin daemon to starve) and let the
# single module's Kotlin tasks parallelise with the rest of the graph.
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true
kotlin.compiler.execution.strategy=in-process

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enable R8 full mode.
android.enableR8.fullMode=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false

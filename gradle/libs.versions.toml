[versions]
kotlin = "2.2.0"
agp = "8.11.1"
coroutines = "1.10.2"
robolectric = "4.15.1"
androidxTest = "1.6.1"
androidxTestExt = "1.2.1"
androidxTestRunner = "1.6.2"
espresso = "3.6.1"
junit = "4.13.2"
json = "20231013"
appcompat = "1.7.1"
fragment = "1.5.4"
activityCompose = "1.10.1"
compose = "1.8.3"
composeMaterial3 = "1.3.2"
datastore = "1.1.7"
recyclerview = "1.4.0"
room = "2.7.2"
hiltNavigationCompose = "1.2.0"
lifecycle = "2.9.2"
glance = "1.1.1"
coreSplashscreen = "1.0.1"
biometric = "1.1.0"
accompanist = "0.36.0"
dagger = "2.57"
hilt = "2.57"
commonsCsv = "1.14.0"
coil = "2.7.0"
desugar = "2.1.5"
work = "2.7.1"
ksp = "2.2.0-2.0.2"

[libraries]
# Core
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# AndroidX
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Compose
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-foundation-layout = { module = "androidx.compose.foundation:foundation-layout", version.ref = "compose" }
compose-ui-util = { module = "androidx.compose.ui:ui-util", version.ref = "compose" }
compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class", version.ref = "composeMaterial3" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
compose-material = { module = "androidx.compose.material:material", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-ui-test = { module = "androidx.compose.ui:ui-test", version.ref = "compose" }

# DataStore
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# RecyclerView
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }

# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# Hilt
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Lifecycle
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }

# Glance
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-appwidget-preview = { module = "androidx.glance:glance-appwidget-preview", version.ref = "glance" }
glance-preview = { module = "androidx.glance:glance-preview", version.ref = "glance" }

# Core
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }

# Accompanist
accompanist-systemuicontroller = { module = "com.google.accompanist:accompanist-systemuicontroller", version.ref = "accompanist" }

# Dagger/Hilt
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hiltNavigationCompose" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

# Utils
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commonsCsv" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# Desugar
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTest" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-application = { id = "com.android.application", version.ref = "agp" }

[bundles]
compose = ["compose-runtime", "compose-foundation", "compose-foundation-layout", "compose-ui-util", "compose-animation", "compose-runtime-livedata", "compose-material3", "compose-material"]
compose-ui-testing = ["compose-ui-tooling", "compose-ui-tooling-preview", "compose-ui-test-manifest", "compose-ui-test-junit4", "compose-ui-test"]
room = ["room-runtime", "room-ktx", "room-paging"]
room-ksp = ["room-compiler"]
hilt = ["hilt-android", "hilt-navigation-compose"]
hilt-ksp = ["hilt-compiler", "dagger-compiler", "hilt-android-compiler"]
dagger = ["dagger"]
dagger-ksp = ["dagger-compiler"]
lifecycle = ["lifecycle-viewmodel-compose", "lifecycle-livedata-ktx"]
glance = ["glance-appwidget", "glance-appwidget-preview", "glance-preview"]
testing = ["junit", "json", "robolectric", "androidx-test-core", "androidx-test-ext-junit", "androidx-test-runner", "androidx-test-rules", "espresso-core", "coroutines-test", "work-testing", "compose-ui-test-junit4", "compose-ui-test-manifest", "compose-ui-test"]
android-test = ["junit", "androidx-test-core", "androidx-test-runner", "androidx-test-ext-junit", "androidx-test-rules", "espresso-core", "coroutines-test", "compose-ui-test", "compose-ui-test-junit4", "hilt-android-testing"]